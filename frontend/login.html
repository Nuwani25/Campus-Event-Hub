<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Campus Event Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      min-height: 100vh;
      background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 48px;
      min-height: calc(100vh - 160px);
    }
    
    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      transition: all 0.3s ease;
    }
    
    .login-container:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    
    /* Social login styles */
    .social-login {
      margin: 20px 0;
      position: relative;
      text-align: center;
    }
    
    .social-login::before {
      content: "";
      display: block;
      height: 1px;
      background: #ddd;
      position: absolute;
      top: 50%;
      width: 100%;
      z-index: 1;
    }
    
    .social-login span {
      background: white;
      padding: 0 15px;
      position: relative;
      z-index: 2;
      color: #777;
      font-size: 14px;
    }
    
    .social-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
    
    .social-btn {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: white;
    }
    
    .social-btn:hover {
      background: #f5f5f5;
      transform: translateY(-2px);
    }
    
    .password-container {
      position: relative;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #777;
      font-size: 16px;
      user-select: none;
    }
    
    h2 {
      text-align: center;
      color: #1e3c72;
      margin-bottom: 25px;
      font-weight: 600;
    }
    
    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 15px;
      padding: 10px;
      background-color: rgba(231, 76, 60, 0.1);
      border-radius: 5px;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      border-color: #2a5298;
      outline: none;
      box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.2);
    }
    
    .form-control::placeholder {
      color: #aaa;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #16335f, #23497e);
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    
    .form-footer {
      text-align: center;
      font-size: 14px;
      margin-top: 25px;
      color: #666;
    }
    
    .form-footer a {
      color: #1e3c72;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .form-footer a:hover {
      color: #2a5298;
      text-decoration: underline;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .remember-me input {
      margin-right: 8px;
    }
    
    .remember-me label {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <header style="
    background: linear-gradient(120deg, #1e3c72 0%, #2a5298 60%, #6dd5ed 100%);
    padding: 40px 0 30px 0;
    box-shadow: 0 4px 24px rgba(30, 60, 114, 0.15), 0 1.5px 12px rgba(42, 82, 152, 0.10);
    position: relative;
    overflow: hidden;
    width: 100vw;
    min-width: 360px;
  ">
    <!-- Decorative radial overlay -->
    <div style="
      position: absolute;
      top: -40px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 80%);
      z-index: 1;
      pointer-events: none;
    "></div>
    <div style="
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      color: #fff;
    ">
      <h1 style="
        margin: 0;
        font-size: 2.7rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(30,60,114,0.18);
      ">
        Campus Event Hub
      </h1>
      <span style="
        display: block;
        margin-top: 12px;
        font-size: 1.25rem;
        font-weight: 400;
        letter-spacing: 1px;
        opacity: 0.92;
      ">
        Discover. Connect. Celebrate.
      </span>
    </div>
  </header>

  <div class="main-content">
    <div class="login-container">

      <h2>Welcome Back</h2>
      <div id="error" class="error"></div>
      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" class="form-control" placeholder="Email Address" required />
        </div>
        <div class="form-group password-container">
          <input type="password" id="password" class="form-control" placeholder="Password" required />
          <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
        </div>
        <div class="remember-me">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>
        <button id="loginButton" type="submit" class="btn btn-primary">Sign In</button>
        
        <div class="social-login">
          <span>Or sign in with</span>
        </div>
        <div class="social-btns">
          <button type="button" class="social-btn" title="Google">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#DB4437">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
          </button>
          <button type="button" class="social-btn" title="Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
          </button>
          <button type="button" class="social-btn" title="Apple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#000000">
              <path d="M16.125 0c.167 1.567-.483 3.122-1.55 4.125s-2.492 1.509-4 1.375c-.175-1.484.5-2.992 1.525-3.967S14.55.125 16.125 0zm5.517 17.017c-.65 1.133-1.325 2.167-2.4 3.166-.95.934-1.933 1.959-3.417 1.967-1.466.008-1.933-.85-3.6-.85-1.675 0-2.2.825-3.592.883-1.45.058-2.558-1.008-3.517-1.942-1.9-1.925-3.358-5.425-3.358-8.55 0-5.025 3.267-7.692 6.483-7.692 1.709 0 3.125 1.142 4.2 1.142 1.034 0 2.967-1.258 4.917-1.075 2.308.1 4.025 1.283 5.108 3.25-4.608 2.842-3.867 9.617.175 11.7z" />
            </svg>
          </button>
          <button type="button" class="social-btn" title="Twitter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1DA1F2">
              <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723 10.1 10.1 0 01-3.127 1.184 4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z" />
            </svg>
          </button>
        </div>
      </form>
      <div class="form-footer">
        <p>Don't have an account? <a href="index.html">Register</a></p>
        <p style="margin-top: 10px;"><a href="#">Forgot password?</a></p>
      </div>
    </div>
  </div>
  
  <script>
    const loginButton = document.getElementById('loginButton');
    const errorDiv = document.getElementById('error');
    
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.toggle-password');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleButton.textContent = '👁️‍🗨️';
      } else {
        passwordInput.type = 'password';
        toggleButton.textContent = '👁️';
      }
    }
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      // Show loading state
      loginButton.textContent = 'Signing in...';
      loginButton.disabled = true;
      
      try {
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          errorDiv.textContent = result.message || 'Invalid email or password';
          errorDiv.classList.add('show');
          return;
        }
        
        // Save token and user data
        localStorage.setItem('token', result.token);
        localStorage.setItem('studentEmail', result.student.email);
        localStorage.setItem('studentName', result.student.name);
        
        window.location.href = 'home.html';
        
      } catch (error) {
        console.error('Login Error:', error);
        errorDiv.textContent = 'Error connecting to server. Please try again later.';
        errorDiv.classList.add('show');
      } finally {
        // Reset button state
        loginButton.textContent = 'Sign In';
        loginButton.disabled = false;
      }
    });
    
    // Clear error message when user starts typing
    document.getElementById('email').addEventListener('input', () => {
      errorDiv.classList.remove('show');
    });
    
    document.getElementById('password').addEventListener('input', () => {
      errorDiv.classList.remove('show');
    });
  </script>
</body>
</html>
